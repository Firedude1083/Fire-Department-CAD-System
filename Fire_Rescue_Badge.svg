<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .badge-red { fill: none; stroke: #cc0000; stroke-width: 3; stroke-linejoin: round; }
      .badge-fill { fill: #cc0000; }
      .badge-text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #cc0000; text-anchor: middle; }
      .badge-symbol { fill: #cc0000; }
    </style>
  </defs>
  
  <!-- Maltese Cross Background -->
  <g class="badge-red">
    <!-- Top arm -->
    <path d="M 120 20 L 140 60 L 160 40 L 140 80 L 180 60 L 160 80 L 180 100 L 140 80 L 150 120 L 120 100 L 120 20 Z"/>
    <!-- Right arm -->
    <path d="M 220 120 L 180 140 L 200 160 L 160 140 L 180 180 L 160 160 L 140 180 L 160 140 L 120 150 L 140 120 L 220 120 Z"/>
    <!-- Bottom arm -->
    <path d="M 120 220 L 100 180 L 80 200 L 100 160 L 60 180 L 80 160 L 60 140 L 100 160 L 90 120 L 120 140 L 120 220 Z"/>
    <!-- Left arm -->
    <path d="M 20 120 L 60 100 L 40 80 L 80 100 L 60 60 L 80 80 L 100 60 L 80 100 L 120 90 L 100 120 L 20 120 Z"/>
  </g>
  
  <!-- Center Circle -->
  <circle cx="120" cy="120" r="50" class="badge-red"/>
  <circle cx="120" cy="120" r="45" fill="white"/>
  
  <!-- Fire Hydrant (left symbol) -->
  <g class="badge-symbol">
    <rect x="80" y="105" width="6" height="25" rx="2"/>
    <ellipse cx="83" cy="105" rx="4" ry="3"/>
    <rect x="78" y="100" width="10" height="6" rx="1"/>
  </g>
  
  <!-- Ladder (center symbol) -->
  <g class="badge-symbol">
    <line x1="110" y1="135" x2="130" y2="105" stroke="#cc0000" stroke-width="2"/>
    <line x1="112" y1="133" x2="132" y2="103" stroke="#cc0000" stroke-width="2"/>
    <line x1="115" y1="125" x2="118" y2="125" stroke="#cc0000" stroke-width="1.5"/>
    <line x1="120" y1="118" x2="123" y2="118" stroke="#cc0000" stroke-width="1.5"/>
    <line x1="125" y1="111" x2="128" y2="111" stroke="#cc0000" stroke-width="1.5"/>
  </g>
  
  <!-- Medical Cross (right symbol) -->
  <g class="badge-symbol">
    <rect x="152" y="110" width="4" height="20" rx="1"/>
    <rect x="144" y="118" width="20" height="4" rx="1"/>
  </g>
  
  <!-- "FIRE" text (top) -->
  <text x="120" y="75" class="badge-text" font-size="18">FIRE</text>
  
  <!-- "RESCUE" text (bottom) -->
  <text x="120" y="160" class="badge-text" font-size="18">RESCUE</text>
</svg>
