<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire CAD PRO - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a2a4a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 12px;
            border: 2px solid #d4a574;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 102, 204, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff8800 0%, #ff2222 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 20px;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
        }

        .logo-section h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }

        .logo-section p {
            font-size: 14px;
            color: #ffaa00;
            margin: 0;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4a574, transparent);
            margin: 25px 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #ffaa00;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d4a574;
            box-shadow: 0 0 12px rgba(0, 102, 204, 0.3);
            background: #3a3a4e;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .demo-users {
            background: #2a2a3e;
            border: 1px solid #d4a574;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #ccc;
        }

        .demo-users strong {
            color: #ffaa00;
            display: block;
            margin-bottom: 8px;
        }

        .demo-user {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            padding: 6px 0;
            border-bottom: 1px solid #3a3a4e;
        }

        .demo-user:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .demo-user code {
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4a574 0%, #ffaa00 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 204, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background: #3a1a1a;
            border: 1px solid #ff2222;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ff6b6b;
        }

        .error-message.show {
            display: block;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-btn {
            padding: 12px;
            background: #2a2a3e;
            border: 2px solid #3a3a4e;
            border-radius: 6px;
            color: #999;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .role-btn:hover {
            border-color: #d4a574;
        }

        .role-btn.active {
            background: #d4a574;
            border-color: #d4a574;
            color: white;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #d4a574;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-info {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        .footer-info a {
            color: #ffaa00;
            text-decoration: none;
        }

        .footer-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo"><img src="/Fire_Rescue_Badge.svg" class="fire-logo" alt="Fire Rescue" style="width: 24px; height: 24px; display: inline-block; margin: 0 4px; vertical-align: middle;"></div>
            <h1>Fire CAD PRO</h1>
            <p>Dispatch & Drone Operations System</p>
        </div>

        <div class="divider"></div>

        <div class="error-message" id="error-message"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Select Role</label>
                <div class="role-selector">
                    <button type="button" class="role-btn active" data-role="user" onclick="selectRole('user')">
                        <i class="fas fa-user"></i> User
                    </button>
                    <button type="button" class="role-btn" data-role="admin" onclick="selectRole('admin')">
                        <i class="fas fa-shield"></i> Admin
                    </button>
                </div>
            </div>

            <div class="demo-users">
                <strong>Demo Credentials:</strong>
                <div class="demo-user">
                    <span>Admin:</span>
                    <span><code>admin</code> / <code>admin123</code></span>
                </div>
                <div class="demo-user">
                    <span>User:</span>
                    <span><code>dispatcher</code> / <code>pass123</code></span>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
        </form>

        <div class="footer-info">
            <p>Fire CAD PRO v2.1.0 © 2026</p>
            <p><a href="https://fireCADpro.com">www.fireCADpro.com</a></p>
        </div>
    </div>

    <script>
        let selectedRole = 'user';

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });
        }

        function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const loading = document.getElementById('loading');

            errorMsg.classList.remove('show');

            // Validate credentials
            const credentials = {
                admin: { username: 'admin', password: 'admin123' },
                user: { username: 'dispatcher', password: 'pass123' }
            };

            loading.style.display = 'block';

            setTimeout(() => {
                loading.style.display = 'none';

                const validCreds = credentials[selectedRole];

                if (username === validCreds.username && password === validCreds.password) {
                    // Store auth info
                    const authData = {
                        username: username,
                        role: selectedRole,
                        loginTime: new Date().toISOString(),
                        token: Math.random().toString(36).substr(2)
                    };

                    localStorage.setItem('fireCADAuth', JSON.stringify(authData));
                    localStorage.setItem('fireCADRole', selectedRole);

                    // Redirect based on role
                    if (selectedRole === 'admin') {
                        window.location.href = 'dashboard.html?mode=admin';
                    } else {
                        window.location.href = 'dashboard.html?mode=user';
                    }
                } else {
                    errorMsg.textContent = '❌ Invalid username or password';
                    errorMsg.classList.add('show');
                    document.getElementById('password').value = '';
                }
            }, 800);
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const auth = localStorage.getItem('fireCADAuth');
            if (auth) {
                try {
                    const authData = JSON.parse(auth);
                    const mode = authData.role === 'admin' ? 'admin' : 'user';
                    window.location.href = `dashboard.html?mode=${mode}`;
                } catch (e) {
                    console.log('Invalid auth data');
                }
            }
        });
    </script>
</body>
</html>
