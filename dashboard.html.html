<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire CAD PRO - Dispatch & Drone Operations</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            background: #2a2a3e;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }

        .top-bar h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .top-bar button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2a2a3e;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 70px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px;
            color: #999;
            text-align: center;
            font-size: 11px;
            flex: 1;
            border-top: 3px solid transparent;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: #0066cc;
            border-top-color: #0066cc;
        }

        .nav-item:hover {
            color: #fff;
        }

        .nav-item i {
            font-size: 20px;
        }

        .incident-card {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .incident-card:hover {
            background: #333;
            border-color: #555;
        }

        .incident-card.active {
            border-color: #0066cc;
            background: #1a2844;
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .incident-type {
            background: #0066cc;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .incident-type.fire {
            background: #ff6b6b;
        }

        .incident-type.medical {
            background: #00aa00;
        }

        .incident-type.accident {
            background: #ffa500;
        }

        .incident-timer {
            color: #ff6b6b;
            font-weight: 600;
            font-size: 12px;
        }

        .incident-info {
            font-size: 13px;
            line-height: 1.6;
            color: #ccc;
        }

        .incident-info strong {
            color: #fff;
        }

        .incident-address {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin: 8px 0;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .quick-action {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .quick-action:hover {
            background: #333;
            border-color: #0066cc;
            color: #0066cc;
        }

        .quick-action i {
            font-size: 24px;
        }

        .quick-action-full {
            grid-column: 1 / -1;
        }

        .detail-section {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #0066cc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-content {
            font-size: 13px;
            line-height: 1.8;
            color: #ccc;
        }

        .preplan-info {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 8px;
        }

        .hydrant-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hydrant-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #00aa00;
            font-size: 12px;
        }

        .hydrant-distance {
            color: #0066cc;
            font-weight: 600;
            margin-right: 8px;
        }

        .unit-badge {
            background: #0066cc;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin: 4px 4px 4px 0;
        }

        .status-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .status-btn {
            padding: 10px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .status-btn.active {
            background: #0066cc;
            border-color: #0066cc;
            color: white;
        }

        .status-btn:hover {
            border-color: #0066cc;
            color: #0066cc;
        }

        .back-btn {
            background: #2a2a3e;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .back-btn:hover {
            background: #333;
        }

        .menu-section {
            margin-bottom: 15px;
        }

        .menu-title {
            color: #666;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 15px;
        }

        .menu-item {
            padding: 12px 15px;
            color: #ccc;
            border-bottom: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: #333;
            color: #0066cc;
        }

        .menu-item i {
            margin-right: 12px;
        }

        .submenu {
            display: none;
            background: #1a1a1a;
            border-left: 3px solid #0066cc;
        }

        .submenu.open {
            display: block;
        }

        .submenu-item {
            padding: 10px 15px 10px 30px;
            color: #999;
            border-bottom: 1px solid #2a2a3e;
            cursor: pointer;
            font-size: 12px;
        }

        .submenu-item:hover {
            color: #0066cc;
            background: #2a2a3e;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .chat-message {
            margin-bottom: 12px;
            font-size: 12px;
        }

        .chat-message.incoming {
            color: #ccc;
        }

        .chat-message.outgoing {
            color: #0066cc;
            text-align: right;
        }

        .chat-input {
            padding: 15px;
            border-top: 1px solid #444;
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
        }

        .chat-input button {
            background: #0066cc;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #0066cc;
        }

        .stat-label {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal {
            background: #2a2a3e;
            border-radius: 12px 12px 0 0;
            padding: 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 1px solid #444;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ccc;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #ccc;
            font-size: 13px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #0052a3;
        }

        .drone-status-ready {
            border-left-color: #00aa00;
        }

        .drone-status-inflight {
            border-left-color: #0066cc;
        }

        .drone-battery-low {
            color: #ff6b6b;
        }

        .drone-battery-medium {
            color: #ffa500;
        }

        .drone-battery-high {
            color: #00aa00;
        }

        .checklist-item {
            cursor: pointer;
            transition: background 0.2s;
        }

        .checklist-item:hover {
            background: #2a2a3e;
        }

        .checklist-item input[type="checkbox"] {
            accent-color: #0066cc;
        }

        @media (max-width: 480px) {
            .quick-actions {
                grid-template-columns: 1fr;
            }

            .quick-action-full {
                grid-column: 1 / -1;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: #2a2a3e;
            border: 2px solid #0066cc;
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            min-width: 250px;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
            animation: slideUp 0.3s ease-out;
            pointer-events: auto;
            text-align: center;
        }

        .toast.success {
            border-color: #00aa00;
            background: #1a3a1a;
        }

        .toast.error {
            border-color: #ff2222;
            background: #3a1a1a;
        }

        .toast.warning {
            border-color: #ffaa00;
            background: #3a2a1a;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Dark Mode Toggle */
        .dark-mode-toggle {
            background: none;
            border: 1px solid #444;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }

        .dark-mode-toggle:hover {
            background: #333;
            border-color: #0066cc;
            color: #0066cc;
        }

        /* Dashboard Stats */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #2a2a3e 0%, #1a1a2e 100%);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #0066cc;
        }

        .stat-card.warning .stat-value {
            color: #ffaa00;
        }

        .stat-card.error .stat-value {
            color: #ff2222;
        }

        .stat-card.success .stat-value {
            color: #00aa00;
        }

        /* Search Bar */
        .search-bar {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 15px;
            width: 100%;
        }

        .search-bar::placeholder {
            color: #666;
        }

        .search-bar:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 8px rgba(0, 102, 204, 0.3);
        }

        /* Weather Widget */
        .weather-widget {
            background: linear-gradient(135deg, #2a3a3e 0%, #1a2a3e 100%);
            border: 1px solid #0066cc;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .weather-icon {
            font-size: 24px;
        }

        .weather-text {
            display: flex;
            flex-direction: column;
        }

        .weather-temp {
            font-size: 14px;
            font-weight: 600;
            color: #00d4ff;
        }

        .weather-condition {
            font-size: 11px;
            color: #999;
        }

        .weather-warning {
            background: #ffaa00;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        /* Quick Assign Buttons */
        .quick-assign-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin: 10px 0;
            padding: 5px 0;
        }

        .quick-assign-btn {
            background: #2a2a3e;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .quick-assign-btn:hover {
            background: #0066cc;
            border-color: #0066cc;
            color: #fff;
            box-shadow: 0 0 8px rgba(0, 102, 204, 0.4);
        }

        .quick-assign-btn.assigned {
            background: #00aa00;
            border-color: #00aa00;
        }

        /* Dashboard Layout */
        .dashboard-container {
            padding-bottom: 70px;
        }

        .dashboard-title {
            font-size: 16px;
            font-weight: 700;
            margin: 15px 0 10px 0;
            color: #0066cc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Light Mode Styles */
        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }

        body.light-mode .app-container,

        function selectIncident(id) {
            state.selectedIncident = id;

        // Toast Notification System
        function showToast(message, type = 'default') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Dark Mode Toggle
        function initDarkMode() {
            const isDarkMode = localStorage.getItem('darkMode') !== 'false';
            if (!isDarkMode) {
                document.body.classList.add('light-mode');
            }
        }

        function toggleDarkMode() {
            const isDarkMode = document.body.classList.toggle('light-mode');
            localStorage.setItem('darkMode', !isDarkMode);
            showToast(`${isDarkMode ? '💡' : '🌙'} Mode changed`, 'success');
            render();
        }

        // Search Incidents
        function searchIncidents() {
            const searchTerm = document.getElementById('incident-search')?.value.toLowerCase() || '';
            if (searchTerm.length < 1) return;

            const results = state.incidents.filter(i => 
                i.address.toLowerCase().includes(searchTerm) ||
                i.type.toLowerCase().includes(searchTerm)
            );

            showToast(`Found ${results.length} incident(s) matching "${searchTerm}"`, 'success');
        }

        // Quick Assign Unit
        function quickAssignUnit(unitId, incidentId) {
            const unit = state.units.find(u => u.id === unitId);

                                    <option value="Station 2" ${personnel.station === 'Station 2' ? 'selected' : ''}>Station 2</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Assigned Vehicle</label>
                                <select id="personnel-vehicle">
                                    <option value="">-- No Assignment --</option>
                                    ${vehicles.map(v => `<option value="${v}" ${personnel.assignedVehicle === v ? 'selected' : ''}>${v}</option>`).join('')}
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Shift Start Time (HH:MM)</label>
                                <input type="text" id="personnel-shift-start" value="${personnel.shiftStart || '08:00'}" placeholder="08:00"/>
                            </div>

                            <div class="form-group">
                                <label>Shift End Time (HH:MM)</label>
                                <input type="text" id="personnel-shift-end" value="${personnel.shiftEnd || '20:00'}" placeholder="20:00"/>
                            </div>

                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" id="personnel-phone" value="${personnel.phone || ''}" placeholder="(555) 123-4567"/>
                            </div>

                            <div class="form-group">
                                <label>Certifications</label>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                    ${certs.map(cert => `
                                        <label style="display: flex; align-items: center; cursor: pointer; padding: 8px; background: #2a2a3e; border-radius: 4px;">
                                            <input type="checkbox" value="${cert}" class="cert-checkbox" ${personnel.certifications && personnel.certifications.includes(cert) ? 'checked' : ''} style="margin-right: 8px; cursor: pointer; accent-color: #00aa00;">
                                            <span style="font-size: 12px;">${cert}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Status</label>
                                <div style="display: flex; gap: 8px;">
                                    <label style="flex: 1; display: flex; align-items: center; padding: 8px; background: ${personnel.onDuty !== false ? '#1a3a1a' : '#2a2a3e'}; border-radius: 4px; cursor: pointer; border: 1px solid #00aa00;">
                                        <input type="radio" name="personnel-status" value="on-duty" ${personnel.onDuty !== false ? 'checked' : ''} style="margin-right: 8px; cursor: pointer;">
                                        <span style="font-size: 12px;">On-Duty</span>
                                    </label>
                                    <label style="flex: 1; display: flex; align-items: center; padding: 8px; background: ${personnel.onDuty === false ? '#2a2a3e' : '#2a2a3e'}; border-radius: 4px; cursor: pointer;">
                                        <input type="radio" name="personnel-status" value="off-duty" ${personnel.onDuty === false ? 'checked' : ''} style="margin-right: 8px; cursor: pointer;">
                                        <span style="font-size: 12px;">Off-Duty</span>
                                    </label>
                                </div>
                            </div>

                            <button class="btn-primary" onclick="savePersonnel()" style="background: #00aa00; color: #000; margin-top: 15px; margin-bottom: 10px;">
                                💾 Save Personnel
                            </button>
                            <button onclick="closeModal()" style="width: 100%; background: #444; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: 600;">Cancel</button>
                        </div>
                    </div>
                `;
            }

            return html;
        }

        function formatTime(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000 / 60);
            return diff + ' min ago';
        }

        function getStatusColor(status) {
            const colors = {
                'available': '#00aa00',
                'responding': '#ffa500',
                'en-route': '#0066cc',
                'on-scene': '#ff6b6b'
            };
            return colors[status] || '#666';
        }

        function attachEventListeners() {}

        function setTab(tab) {
            state.activeTab = tab;
            state.selectedIncident = null;
            render();
        }

        function selectIncident(id) {
            state.selectedIncident = id;
            render();
        }

        function deselectIncident() {
            state.selectedIncident = null;
            render();
        }

        function logIncidentEvent(incident, status, customMessage = null) {
            if (!incident.incidentLog) {
                incident.incidentLog = [];
            }

            const statusMessages = {
                'in-service': 'Incident in service - units responding',
                'responding': 'Units responding to incident',
                'en-route': 'Units en-route to location',
                'at-hospital': 'Patient transported to hospital',
                'on-scene': 'Units arrived on scene',
                'cleared': 'Incident cleared - units available'
            };

            const message = customMessage || statusMessages[status] || `Status changed to ${status}`;

            incident.incidentLog.push({
                timestamp: new Date(),
                status: status,
                message: message
            });
        }

        function updateIncidentStatus(id, status) {
            const incident = state.incidents.find(i => i.id === id);
            if (incident) {
                const oldStatus = incident.status;
                incident.status = status;
                
                // Log the status change
                logIncidentEvent(incident, status);
                
                // Show notification
                const statusLabels = {
                    'in-service': 'In Service',
                    'responding': 'Responding',
                    'en-route': 'En-Route',
                    'at-hospital': 'At Hospital',
                    'on-scene': 'On Scene',
                    'cleared': 'Cleared'
                };
                
                showToast(`📝 Status: ${statusLabels[status]}`, 'success');
                render();
            }
        }

        function respondToIncident(incidentId) {
            const incident = state.incidents.find(i => i.id === incidentId);
            if (incident) {
                const currentUnit = state.currentUnit;
                if (!incident.responders) {
                    incident.responders = [];
                }
                
                const unit = state.units.find(u => u.id === currentUnit);
                
                if (!incident.responders.includes(currentUnit)) {
                    incident.responders.push(currentUnit);
                    showNotification(`✓ ${unit.name} signed on to call. Directions loaded.`);
                } else {
                    showNotification(`${unit.name} already responded to this call.`);
                }
                
                render();
                
                // Show directions
                setTimeout(() => getDirectionsToIncident(incident, unit), 500);
            }
        }

        function getDirectionsToIncident(incident, unit) {
            const address = incident.address;
            showNotification(`📍 ${unit.name} responding to ${address}\n✓ Navigate to scene\n⏱ Update status when arriving`);
        }

        function addDispatchNote(incidentId) {
            const input = document.getElementById(`note-input-${incidentId}`);
            if (!input || !input.value.trim()) {
                showNotification('Please enter a note');
                return;
            }

            const incident = state.incidents.find(i => i.id === incidentId);
            if (incident) {
                if (!incident.dispatchNotes) {
                    incident.dispatchNotes = [];
                }

                const newNote = {
                    timestamp: new Date(),
                    text: input.value.trim(),
                    dispatcher: 'Dispatch'
                };

                incident.dispatchNotes.push(newNote);
                input.value = '';
                
                showNotification('✓ Note sent to all units');
                render();
            }
        }

        function autofillCurrentLocation() {
            const addressInput = document.getElementById('incident-address');
            if (addressInput) {
                // Simulate getting current location
                addressInput.value = '123 Main Street Station (Current Location)';
                showNotification('✓ Current location loaded');
            }
        }

        function autofillRecentAddress(index) {
            const addressInput = document.getElementById('incident-address');
            if (addressInput && state.incidents && state.incidents[index]) {
                addressInput.value = state.incidents[index].address;
                showNotification(`✓ ${state.incidents[index].address} autofilled`);
            }
        }

        function openNewIncidentModal() {
            state.showModal = true;
            state.modalType = 'new-incident';
            render();
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            state.showModal = false;
            render();
        }

        function createNewIncident() {
            const type = document.getElementById('incident-type').value;
            const address = document.getElementById('incident-address').value;
            const caller = document.getElementById('incident-caller').value;
            const phone = document.getElementById('incident-phone').value;
            const details = document.getElementById('incident-details').value;

            if (!address || !caller) {
                alert('Please fill in address and caller');
                return;
            }

            const typeLabels = { medical: 'Medical Emergency', fire: 'Structure Fire', accident: 'Motor Vehicle Accident' };
            const newIncident = {
                id: Math.max(...state.incidents.map(i => i.id)) + 1,
                type: typeLabels[type],
                category: type,
                address,
                lat: 40.75 + Math.random() * 0.05,
                lng: -73.98 + Math.random() * 0.05,
                caller,
                phone,
                time: new Date(),
                status: 'responding',
                priority: 'high',
                units: [],
                details,
                preplan: {},
                hydrants: []
            };

            state.incidents.unshift(newIncident);
            state.showModal = false;
            showNotification(`New incident: ${typeLabels[type]}`);
            render();
        }

        function showNotification(message) {
            showToast(message, 'default');
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            if (submenu) {
                submenu.classList.toggle('open');
            }
        }

        function handleChatKeypress(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            if (input.value.trim()) {
                state.chatMessages.push({
                    type: 'outgoing',
                    message: input.value
                });
                input.value = '';
                render();
            }
        }

        function toggleChecklistItem(index) {
            state.preFlightChecklist[index].checked = !state.preFlightChecklist[index].checked;
            render();
        }

        function launchDrone(droneId) {
            const drone = state.drones.find(d => d.id === droneId);
            if (drone) {
                drone.status = 'in-flight';
                drone.location = 'In Flight';
                showNotification(`🚁 ${drone.name} launched! Monitoring flight...`);
                
                // Add flight log entry
                state.flightLog.unshift({
                    date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    drone: drone.name,
                    incident: 'Active Incident Area',
                    duration: '-- min',
                    distance: '--',
                    purpose: 'Real-time monitoring & assessment'
                });
                
                render();
                if (state.activeTab === 'map') {
                    setTimeout(() => initMap(), 100);
                }
            }
        }

        function abortMission(droneId) {
            const drone = state.drones.find(d => d.id === droneId);
            if (drone && drone.status === 'in-flight') {
                drone.status = 'ready';
                drone.location = 'Station 1';
                showNotification(`⛔ ${drone.name} mission aborted. Returning to base...`);
                render();
                if (state.activeTab === 'map') {
                    setTimeout(() => initMap(), 100);
                }
            }
        }

        function planDroneMission() {
            state.showModal = true;
            state.modalType = 'drone-mission';
            render();
        }

        function autofillDroneAddress(index) {
            const addressInput = document.getElementById('drone-mission-address');
            if (addressInput) {
                if (index === 'current') {
                    addressInput.value = '123 Main Street Station (Current Location)';
                    showNotification('✓ Current location loaded');
                } else if (state.incidents && state.incidents[index]) {
                    addressInput.value = state.incidents[index].address;
                    showNotification(`✓ ${state.incidents[index].address} autofilled`);
                }
            }
        }

        function launchDroneMission() {
            const address = document.getElementById('drone-mission-address').value;
            const missionType = document.getElementById('drone-mission-type').value;
            const droneId = parseInt(document.getElementById('drone-selection').value);

            if (!address.trim()) {
                showNotification('Please enter target address');
                return;
            }

            const drone = state.drones.find(d => d.id === droneId);
            if (drone) {
                drone.status = 'in-flight';
                drone.location = address;
                
                if (!state.droneMissions) {
                    state.droneMissions = [];
                }
                
                state.droneMissions.push({
                    id: state.droneMissions.length + 1,
                    drone: drone.name,
                    type: missionType,
                    target: address,
                    launched: new Date(),
                    status: 'in-flight'
                });

                showNotification(`🚁 ${drone.name} deployed to ${address}\n✓ Mission type: ${missionType}`);
                state.showModal = false;
                render();
                setTimeout(() => initMap(), 100);
            }
        }

        function openUnitChecklist(unitId) {
            state.selectedUnitForChecklist = unitId;
            state.showModal = true;
            state.modalType = 'vehicle-checklist';
            render();
        }

        function toggleChecklistItem(unitId, itemIndex) {
            const unit = state.units.find(u => u.id === unitId);
            if (unit) {
                const checklist = state.vehicleChecklists[unit.type];
                if (checklist && checklist[itemIndex]) {
                    checklist[itemIndex].completed = !checklist[itemIndex].completed;
                    render();
                }
            }
        }

        function completeUnitChecklist(unitId) {
            const unit = state.units.find(u => u.id === unitId);
            if (unit) {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                unit.lastChecked = `Today ${hours}:${minutes}`;
                
                showNotification(`✓ ${unit.name} checklist completed and saved`);
                state.showModal = false;
                render();
            }
        }

        function resetUnitChecklist(unitId) {
            const unit = state.units.find(u => u.id === unitId);
            if (unit) {
                const checklist = state.vehicleChecklists[unit.type];
                if (checklist) {
                    checklist.forEach(item => item.completed = false);
                    showNotification(`↻ ${unit.name} checklist reset`);
                    render();
                }
            }
        }

        function filterUnits(type) {
            if (type === 'all') {
                // Show all units - just render
                render();
            } else {
                // Filter and show only selected type
                showNotification(`Filtering ${type} units...`);
                render();
            }
        }

        let mapContainerElement = null;

        function initMap() {
            try {
                const mapContainer = document.getElementById('map');
                if (!mapContainer) return;
                
                mapContainerElement = mapContainer;
                mapContainer.innerHTML = '';
                
                // Create SVG map with larger viewBox for more space
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.setAttribute('viewBox', '0 0 1000 700');
                svg.style.background = 'linear-gradient(135deg, #1a2a4a 0%, #2a1a3a 50%, #1a2a3a 100%)';
                svg.style.display = 'block';

                // Add defs for gradients and patterns
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                
                // Street grid pattern
                const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
                pattern.setAttribute('id', 'grid');
                pattern.setAttribute('width', '50');
                pattern.setAttribute('height', '50');
                pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                
                const streetH = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                streetH.setAttribute('x1', '50');
                streetH.setAttribute('y1', '0');
                streetH.setAttribute('x2', '50');
                streetH.setAttribute('y2', '50');
                streetH.setAttribute('stroke', '#445566');
                streetH.setAttribute('stroke-width', '0.8');
                
                const streetV = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                streetV.setAttribute('x1', '0');
                streetV.setAttribute('y1', '50');
                streetV.setAttribute('x2', '50');
                streetV.setAttribute('y2', '50');
                streetV.setAttribute('stroke', '#445566');
                streetV.setAttribute('stroke-width', '0.8');
                
                pattern.appendChild(streetH);
                pattern.appendChild(streetV);
                defs.appendChild(pattern);
                svg.appendChild(defs);

                // Background with street grid
                const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                bgRect.setAttribute('width', '1000');
                bgRect.setAttribute('height', '700');
                bgRect.setAttribute('fill', 'url(#grid)');
                svg.appendChild(bgRect);

                // Add area labels (streets/neighborhoods)
                const areaLabels = [
                    { text: 'Downtown', x: 200, y: 150, size: 14 },
                    { text: 'Oak Street', x: 500, y: 250, size: 14 },
                    { text: 'I-90 Corridor', x: 700, y: 400, size: 14 },
                    { text: 'Hospital Zone', x: 300, y: 500, size: 12 }
                ];
                
                areaLabels.forEach(label => {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', label.x);
                    text.setAttribute('y', label.y);
                    text.setAttribute('font-size', label.size);
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', '#556677');
                    text.setAttribute('opacity', '0.6');
                    text.textContent = label.text;
                    svg.appendChild(text);
                });

                // Add STATION marker (larger blue square)
                const stationGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                const stationRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                stationRect.setAttribute('x', '80');
                stationRect.setAttribute('y', '80');
                stationRect.setAttribute('width', '35');
                stationRect.setAttribute('height', '35');
                stationRect.setAttribute('fill', '#0066ff');
                stationRect.setAttribute('rx', '3');
                stationRect.setAttribute('stroke', '#0099ff');
                stationRect.setAttribute('stroke-width', '2');
                
                const stationIcon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                stationIcon.setAttribute('x', '97.5');
                stationIcon.setAttribute('y', '102');
                stationIcon.setAttribute('text-anchor', 'middle');
                stationIcon.setAttribute('font-size', '18');
                stationIcon.textContent = '🏘️';
                
                const stationLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                stationLabel.setAttribute('x', '97.5');
                stationLabel.setAttribute('y', '130');
                stationLabel.setAttribute('text-anchor', 'middle');
                stationLabel.setAttribute('font-size', '12');
                stationLabel.setAttribute('font-weight', 'bold');
                stationLabel.setAttribute('fill', '#0099ff');
                stationLabel.textContent = 'Station 1';
                
                stationGroup.appendChild(stationRect);
                stationGroup.appendChild(stationIcon);
                stationGroup.appendChild(stationLabel);
                svg.appendChild(stationGroup);

                // Add NO-FLY ZONES (red circles with warning)
                state.noFlyZones.forEach(zone => {
                    const x = 200 + (zone.lat - 40.7500) * 500;
                    const y = 200 + (zone.lng + 73.9800) * 500;
                    
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x);
                    circle.setAttribute('cy', y);
                    circle.setAttribute('r', zone.radius * 60);
                    circle.setAttribute('fill', '#ff4444');
                    circle.setAttribute('fill-opacity', '0.08');
                    circle.setAttribute('stroke', '#ff4444');
                    circle.setAttribute('stroke-width', '2');
                    circle.setAttribute('stroke-dasharray', '5,5');
                    
                    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                    title.textContent = `⚠️ ${zone.name} - No Fly Zone`;
                    circle.appendChild(title);
                    svg.appendChild(circle);
                    
                    // Zone label
                    const zoneLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    zoneLabel.setAttribute('x', x);
                    zoneLabel.setAttribute('y', y - zone.radius * 60 - 15);
                    zoneLabel.setAttribute('text-anchor', 'middle');
                    zoneLabel.setAttribute('font-size', '11');
                    zoneLabel.setAttribute('font-weight', 'bold');
                    zoneLabel.setAttribute('fill', '#ff6666');
                    zoneLabel.textContent = `⚠️ ${zone.name}`;
                    svg.appendChild(zoneLabel);
                });

                // Add INCIDENT markers (colored circles - LARGER)
                state.incidents.forEach(incident => {
                    const color = incident.status === 'on-scene' ? '#00ff44' : 
                                 incident.status === 'en-route' ? '#00ccff' : '#ffaa00';
                    
                    const x = 200 + (incident.lat - 40.7500) * 500;
                    const y = 200 + (incident.lng + 73.9800) * 500;
                    
                    // Outer glow
                    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    glow.setAttribute('cx', x);
                    glow.setAttribute('cy', y);
                    glow.setAttribute('r', '18');
                    glow.setAttribute('fill', color);
                    glow.setAttribute('fill-opacity', '0.15');
                    svg.appendChild(glow);
                    
                    // Main marker
                    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    marker.setAttribute('cx', x);
                    marker.setAttribute('cy', y);
                    marker.setAttribute('r', '12');
                    marker.setAttribute('fill', color);
                    marker.setAttribute('stroke', '#000');
                    marker.setAttribute('stroke-width', '2');
                    marker.style.cursor = 'pointer';
                    marker.style.filter = 'drop-shadow(0 0 4px ' + color + ')';
                    
                    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                    title.textContent = `📍 ${incident.type}\n${incident.address}\nStatus: ${incident.status}`;
                    marker.appendChild(title);
                    
                    marker.addEventListener('click', () => selectIncident(incident.id));
                    svg.appendChild(marker);
                    
                    // Incident label below
                    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    label.setAttribute('x', x);
                    label.setAttribute('y', y + 30);
                    label.setAttribute('text-anchor', 'middle');
                    label.setAttribute('font-size', '11');
                    label.setAttribute('font-weight', 'bold');
                    label.setAttribute('fill', color);
                    label.textContent = incident.type.substring(0, 8);
                    svg.appendChild(label);
                });

                // Add UNIT markers (red circles with smaller size)
                state.units.forEach(unit => {
                    const unitIncident = state.incidents.find(i => i.units.includes(unit.id));
                    if (unitIncident) {
                        const x = 200 + (unitIncident.lat - 40.7500) * 500;
                        const y = 200 + (unitIncident.lng + 73.9800) * 500;
                        
                        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        marker.setAttribute('cx', x);
                        marker.setAttribute('cy', y);
                        marker.setAttribute('r', '8');
                        marker.setAttribute('fill', '#ff4444');
                        marker.setAttribute('stroke', '#fff');
                        marker.setAttribute('stroke-width', '2');
                        marker.style.cursor = 'pointer';
                        
                        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                        title.textContent = `🚒 ${unit.name}\nStatus: ${unit.status}\nCrew: ${unit.crew}`;
                        marker.appendChild(title);
                        
                        svg.appendChild(marker);
                    }
                });

                // Add DRONE markers (cyan circles - only in-flight)
                state.drones.forEach(drone => {
                    if (drone.status === 'in-flight') {
                        const droneX = 400 + Math.random() * 300;
                        const droneY = 300 + Math.random() * 250;
                        
                        // Drone path line
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        path.setAttribute('cx', droneX);
                        path.setAttribute('cy', droneY);
                        path.setAttribute('r', '15');
                        path.setAttribute('fill', '#00d4ff');
                        path.setAttribute('fill-opacity', '0.1');
                        svg.appendChild(path);
                        
                        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        marker.setAttribute('cx', droneX);
                        marker.setAttribute('cy', droneY);
                        marker.setAttribute('r', '9');
                        marker.setAttribute('fill', '#00d4ff');
                        marker.setAttribute('stroke', '#00ffff');
                        marker.setAttribute('stroke-width', '2');
                        marker.style.filter = 'drop-shadow(0 0 5px #00d4ff)';
                        
                        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                        title.textContent = `🚁 ${drone.name}\nBattery: ${drone.battery}%\nStatus: In-Flight`;
                        marker.appendChild(title);
                        
                        svg.appendChild(marker);
                        
                        // Drone label
                        const droneLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        droneLabel.setAttribute('x', droneX);
                        droneLabel.setAttribute('y', droneY + 25);
                        droneLabel.setAttribute('text-anchor', 'middle');
                        droneLabel.setAttribute('font-size', '10');
                        droneLabel.setAttribute('font-weight', 'bold');
                        droneLabel.setAttribute('fill', '#00d4ff');
                        droneLabel.textContent = `${drone.battery}%`;
                        svg.appendChild(droneLabel);
                    }
                });

                // Add IMPROVED LEGEND (larger, more readable)
                const legendX = 750;
                const legendY = 40;
                
                const legendBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                legendBg.setAttribute('x', legendX - 10);
                legendBg.setAttribute('y', legendY - 10);
                legendBg.setAttribute('width', '230');
                legendBg.setAttribute('height', '220');
                legendBg.setAttribute('fill', '#0a0e27');
                legendBg.setAttribute('fill-opacity', '0.95');
                legendBg.setAttribute('stroke', '#0066ff');
                legendBg.setAttribute('stroke-width', '2');
                legendBg.setAttribute('rx', '6');
                svg.appendChild(legendBg);
                
                // Legend title
                const legendTitle = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                legendTitle.setAttribute('x', legendX + 105);
                legendTitle.setAttribute('y', legendY + 10);
                legendTitle.setAttribute('text-anchor', 'middle');
                legendTitle.setAttribute('font-size', '14');
                legendTitle.setAttribute('font-weight', 'bold');
                legendTitle.setAttribute('fill', '#0099ff');
                legendTitle.textContent = '📍 LEGEND';
                svg.appendChild(legendTitle);

                const legendItems = [
                    { color: '#0066ff', label: 'Station', icon: '🏘️', y: 35 },
                    { color: '#00ff44', label: 'On-Scene', icon: '✓', y: 60 },
                    { color: '#00ccff', label: 'En-Route', icon: '→', y: 85 },
                    { color: '#ffaa00', label: 'Responding', icon: '!', y: 110 },
                    { color: '#ff4444', label: 'Units', icon: '🚒', y: 135 },
                    { color: '#00d4ff', label: 'Drone', icon: '🚁', y: 160 },
                    { color: '#ff4444', label: 'No-Fly Zone', icon: '⚠️', y: 185 }
                ];

                legendItems.forEach(item => {
                    // Color dot
                    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dot.setAttribute('cx', legendX + 15);
                    dot.setAttribute('cy', legendY + item.y);
                    dot.setAttribute('r', '6');
                    dot.setAttribute('fill', item.color);
                    dot.setAttribute('stroke', '#fff');
                    dot.setAttribute('stroke-width', '1');
                    svg.appendChild(dot);

                    // Label text
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', legendX + 35);
                    text.setAttribute('y', legendY + item.y + 4);
                    text.setAttribute('font-size', '12');
                    text.setAttribute('font-weight', '600');
                    text.setAttribute('fill', '#ddd');
                    text.textContent = item.label;
                    svg.appendChild(text);
                });

                // Add SCALE BAR (bottom left)
                const scaleX = 50;
                const scaleY = 650;
                
                const scaleLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                scaleLine.setAttribute('x1', scaleX);
                scaleLine.setAttribute('y1', scaleY);
                scaleLine.setAttribute('x2', scaleX + 100);
                scaleLine.setAttribute('y2', scaleY);
                scaleLine.setAttribute('stroke', '#aaa');
                scaleLine.setAttribute('stroke-width', '2');
                svg.appendChild(scaleLine);
                
                const scaleLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                scaleLabel.setAttribute('x', scaleX + 50);
                scaleLabel.setAttribute('y', scaleY + 18);
                scaleLabel.setAttribute('text-anchor', 'middle');
                scaleLabel.setAttribute('font-size', '10');
                scaleLabel.setAttribute('fill', '#aaa');
                scaleLabel.textContent = '1 km';
                svg.appendChild(scaleLabel);

                mapContainer.appendChild(svg);
            } catch(e) {
                console.error('Map rendering error:', e);
                showNotification('Map error: ' + e.message);
            }
        }

        // ============================================
        // PERSONNEL MANAGEMENT FUNCTIONS
        // ============================================

        function showPersonnelModal() {
            state.showModal = true;
            state.modalType = 'new-personnel';
            state.selectedPersonnelId = null;
            render();
        }

        function editPersonnel(personnelId) {
            state.showModal = true;
            state.modalType = 'edit-personnel';
            state.selectedPersonnelId = personnelId;
            render();
        }

        function savePersonnel() {
            const name = document.getElementById('personnel-name').value.trim();
            const rank = document.getElementById('personnel-rank').value;
            const station = document.getElementById('personnel-station').value;
            const assignedVehicle = document.getElementById('personnel-vehicle').value || null;
            const shiftStart = document.getElementById('personnel-shift-start').value;
            const shiftEnd = document.getElementById('personnel-shift-end').value;
            const phone = document.getElementById('personnel-phone').value;
            const status = document.querySelector('input[name="personnel-status"]:checked').value;
            const onDuty = status === 'on-duty';
            
            const certCheckboxes = document.querySelectorAll('.cert-checkbox');
            const certifications = Array.from(certCheckboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            if (!name) {
                showToast('Please enter personnel name', 'error');
                return;
            }

            if (state.selectedPersonnelId) {
                // Edit existing
                const index = state.personnel.findIndex(p => p.id === state.selectedPersonnelId);
                if (index !== -1) {
                    state.personnel[index] = {
                        ...state.personnel[index],
                        name,
                        rank,
                        station,
                        assignedVehicle,
                        shiftStart,
                        shiftEnd,
                        phone,
                        onDuty,
                        certifications,
                        status: onDuty ? 'on-duty' : 'off-duty'
                    };
                }
            } else {
                // Add new
                const maxId = Math.max(...state.personnel.map(p => parseInt(p.id.slice(1))), 0);
                const newId = 'P' + String(maxId + 1).padStart(3, '0');
                state.personnel.push({
                    id: newId,
                    name,
                    rank,
                    station,
                    assignedVehicle,
                    onDuty,
                    shiftStart,
                    shiftEnd,
                    phone,
                    certifications,
                    status: onDuty ? 'on-duty' : 'off-duty'
                });
            }

            state.showModal = false;
            state.modalType = null;
            state.selectedPersonnelId = null;
            render();
            showToast('✅ Personnel saved successfully!', 'success');
        }

        function deletePersonnel(personnelId) {
            if (confirm('⚠️ Delete this personnel? This cannot be undone.')) {
                state.personnel = state.personnel.filter(p => p.id !== personnelId);
                render();
                showToast('🗑️ Personnel deleted', 'success');
            }
        }

        function filterPersonnelList(query) {
            const searchInput = document.getElementById('personnelSearch');
            if (!searchInput) return;

            const filtered = state.personnel.filter(p => 
                p.name.toLowerCase().includes(query.toLowerCase()) || 
                p.rank.toLowerCase().includes(query.toLowerCase()) ||
                (p.phone && p.phone.includes(query))
            );

            const tbody = document.querySelector('table tbody');
            if (!tbody) return;

            tbody.innerHTML = filtered.map(p => `
                <tr style="border-bottom: 1px solid #3a3a4e; background: ${p.onDuty ? '#1a2a1a' : '#1a1a2e'};">
                    <td style="padding: 10px;"><strong>${p.name}</strong><br><span style="color: #666; font-size: 11px;">${p.phone}</span></td>
                    <td style="padding: 10px; color: #d4a574; font-weight: 600;">${p.rank}</td>
                    <td style="padding: 10px;">
                        <span style="background: ${p.onDuty ? '#00aa00' : '#666'}; color: #000; padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: 600;">
                            ${p.onDuty ? '🟢 On' : '⚪ Off'}
                        </span>
                    </td>
                    <td style="padding: 10px; color: #ffaa00; font-weight: 600;">${p.assignedVehicle ? p.assignedVehicle : '—'}</td>
                    <td style="padding: 10px; text-align: center;">
                        <button onclick="editPersonnel('${p.id}')" style="background: #0066cc; border: none; color: #fff; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; margin-right: 4px;">Edit</button>
                        <button onclick="deletePersonnel('${p.id}')" style="background: #cc0000; border: none; color: #fff; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 10px;">Del</button>
                    </td>
                </tr>
            `).join('');
        }

        // Get crew for unit
        function getCrewForUnit(vehicleNumber) {
            return state.personnel.filter(p => p.assignedVehicle === vehicleNumber);
        }

        // Get all on-duty personnel
        function getOnDutyPersonnel() {
            return state.personnel.filter(p => p.onDuty);
        }

        // Get personnel by station
        function getPersonnelByStation(station) {
            return state.personnel.filter(p => p.station === station && p.onDuty);
        }

        // Initialize app on load
        initDarkMode();
        render();
    </script>
</body>
</html>
